name: Contracts CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'contracts/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'contracts/**' ]

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        working-directory: contracts
        run: npm ci

      - name: Run Forge build
        working-directory: contracts
        run: |
          forge --version
          forge build --sizes

      - name: Run Forge tests
        working-directory: contracts
        run: |
          forge test -vvv

      - name: Run Hardhat compile
        working-directory: contracts
        run: npx hardhat compile

      - name: Run Hardhat tests
        working-directory: contracts
        run: npx hardhat test

      - name: Check contract sizes
        working-directory: contracts
        run: npx hardhat size-contracts

      - name: Run coverage
        working-directory: contracts
        run: |
          forge coverage --report lcov
          npx hardhat coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./contracts/coverage/lcov.info
          fail_ci_if_error: true

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        working-directory: contracts
        run: npm ci

      - name: Run Slither
        uses: crytic/slither-action@v0.3.0
        with:
          target: 'contracts/src'
          slither-config: contracts/slither.config.json
          fail-on: medium

      - name: Run Mythril (if available)
        working-directory: contracts
        run: |
          if command -v myth &> /dev/null; then
            myth analyze src/marketplace/MarketplaceCore.sol --solv 0.8.24
          else
            echo "Mythril not available, skipping"
          fi
        continue-on-error: true

  gas-report:
    name: Gas Report
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        working-directory: contracts
        run: npm ci

      - name: Generate gas report
        working-directory: contracts
        run: |
          REPORT_GAS=true npx hardhat test
        env:
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}